name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv venv
      - run: venv/bin/python -m pip install -r requirements-dev.txt
      - run: make check
      - run: make demo
      - name: Native imports and helper builds
        run: |
          venv/bin/python -c 'import AppKit, Quartz, Vision, focusledger, notch'
          make build
